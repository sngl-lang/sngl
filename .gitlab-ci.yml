stages:
  - dependencies
  - test
  - pages

# Cancel superseded pipelines instead of letting them pile up. Declared
# in-file rather than relying on the project's "Auto-cancel redundant
# pipelines" toggle, so the behaviour is version controlled.
workflow:
  # Only main and merge requests. Without this, a push to a branch with an
  # open MR builds twice -- once as a branch pipeline, once as an MR pipeline.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  auto_cancel:
    on_new_commit: interruptible

variables:
  IMAGE: $CI_REGISTRY_IMAGE/ci

default:
  # The kaniko build in particular is expensive -- it was a top memory
  # consumer during the host lockups in Aug 2026.
  interruptible: true

build-image:
  stage: dependencies
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - changes:
        - Dockerfile
        - go.mod
        - go.sum
      when: always
    - when: never
  script:
    - mkdir -p /kaniko/.docker
    - >-
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}"
      > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination $IMAGE:latest
      --cache=true

test:
  stage: test
  image: $IMAGE:latest
  # Spelled out even though workflow:rules already decides this: GitLab
  # attempts a merge request pipeline for a push only when some job names
  # merge_request_event. A job with no rules carries an implicit
  # only: [branches, tags], which does not count, and the MR then gets no
  # pipeline at all.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build-image
      optional: true
  script: go tool verify -dry
  coverage: '/total coverage: (\d+\.\d+)% of statements/'

pages:
  stage: pages
  image: $IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build-image
      optional: true
  before_script:
    - "command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )"
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - go tool docsgen -binaries -out public
    - cd public
    - rm -rf .git
    - git init
    - git checkout -b main
    - git add -A
    - git -c user.name="SNGL CI" -c user.email="ci@sngl.dev" commit -m "Deploy docs from $CI_COMMIT_SHORT_SHA"
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git push -f git@github.com:sngl-lang/sngl-lang.github.io.git main
    # Binaries ship to GitHub above; drop them (and the scratch git dir) so the
    # GitLab Pages artifact upload stays small.
    - rm -rf .git downloads
  artifacts:
    paths:
      - public
