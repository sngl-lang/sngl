stages:
  - dependencies
  - test
  - pages

# Cancel superseded pipelines instead of letting them pile up. Declared
# in-file rather than relying on the project's "Auto-cancel redundant
# pipelines" toggle, so the behaviour is version controlled.
workflow:
  # Every branch.
  #
  # This instance never creates a merge request pipeline on its own -- not
  # when the MR opens, not on a push to an open one. POSTing to
  # /merge_requests/:iid/pipelines builds one that runs, so the config admits
  # them; nothing triggers them. Admitted below anyway, for a hand-started run
  # and for the day that changes.
  #
  # A branch pipeline is therefore the only kind that appears by itself, and
  # gating it on CI_OPEN_MERGE_REQUESTS left the ordinary order of work with
  # no pipeline at all: push the branch, then open the MR. The push is gated
  # out because the MR does not exist yet, and opening the MR does not go back
  # and build one for the head it now points at. The branch sat untested until
  # a *second* push, or a hand-started run.
  #
  # So: no gate. The cost is a pipeline on a branch that never becomes an MR,
  # against a 16-minute suite on one runner -- bounded by auto_cancel below,
  # which keeps a series of pushes down to the last one. If that turns out to
  # be too generous, the narrower rule is a branch-name prefix, not a return
  # to CI_OPEN_MERGE_REQUESTS.
  #
  # If this instance ever does start raising merge request pipelines, every
  # push to an MR branch will build two. The fix then is to suppress the
  # branch pipeline for a branch with an open MR:
  #     - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
  #       when: never
  # placed above the branch rule. Adding it *now* would restore the hole this
  # commit closes, and widen it: a branch with an open MR would get nothing.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - when: never
  auto_cancel:
    on_new_commit: interruptible

variables:
  IMAGE: $CI_REGISTRY_IMAGE/ci
  # The runner reuses one build directory per project, and a fetch into it
  # fails outright once a deleted branch leaves a ref behind:
  #   error: some local refs could not be updated
  # It is not the `cache:` index, so the "Clear runner caches" button does
  # not reach it -- every branch deleted since is another chance to hit it.
  # A clone at depth 20 is cheap next to a suite that runs for 16 minutes.
  GIT_STRATEGY: clone
  GIT_DEPTH: "20"

default:
  # The kaniko build in particular is expensive -- it was a top memory
  # consumer during the host lockups in Aug 2026.
  interruptible: true

# What the CI image is built from. Anchored because the rules below ask the
# same question three times, against three different bases.
.image-inputs: &image-inputs
  - Dockerfile
  - go.mod
  - go.sum

build-image:
  stage: dependencies
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  # A failed image build must not take the pipeline with it: `test` and
  # `pages` fall back to the $IMAGE:latest already in the registry, and an
  # `optional` need is only optional about the job *existing*.
  allow_failure: true
  rules:
    # An MR pipeline's `changes` is already diffed against the target branch.
    # Must come first: CI_COMMIT_BEFORE_SHA is zeroed here too.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *image-inputs
      when: always
    # A ref's *first* pipeline has no previous commit to diff against, and
    # GitLab's fallback is to report every file as changed -- which is why a
    # docs-only MR rebuilt the image. compare_to only here: it asks whether
    # the branch *differs* from main rather than whether this push changed
    # anything, so as a blanket rule it would rebuild on every later push to
    # a branch carrying a go.mod bump, over the shared :latest tag.
    - if: $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"
      changes:
        paths: *image-inputs
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
      when: always
    # Every other pipeline, main included: the previous commit is the base,
    # so the image is rebuilt on exactly the push that changes an input.
    - changes:
        paths: *image-inputs
      when: always
    - when: never
  script:
    - mkdir -p /kaniko/.docker
    - >-
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}"
      > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination $IMAGE:latest
      --cache=true

test:
  stage: test
  image: $IMAGE:latest
  needs:
    - job: build-image
      optional: true
  script: go tool verify -dry
  coverage: '/total coverage: (\d+\.\d+)% of statements/'

pages:
  stage: pages
  image: $IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build-image
      optional: true
  before_script:
    - "command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )"
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - go tool docsgen -binaries -out public
    - cd public
    - rm -rf .git
    - git init
    - git checkout -b main
    - git add -A
    - git -c user.name="SNGL CI" -c user.email="ci@sngl.dev" commit -m "Deploy docs from $CI_COMMIT_SHORT_SHA"
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git push -f git@github.com:sngl-lang/sngl-lang.github.io.git main
    # Binaries ship to GitHub above; drop them (and the scratch git dir) so the
    # GitLab Pages artifact upload stays small.
    - rm -rf .git downloads
  artifacts:
    paths:
      - public
