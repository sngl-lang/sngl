<!DOCTYPE html>
<html><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; }
  </style>
</head><body>

<div style="gap:12px;padding:16px;display:flex;flex-direction:column">
  <span id="$1" style="font-size:24px;font-weight:bold">
</span>
  <div style="align-items:center;gap:8px;text-align:center;display:flex;flex-direction:row">
    <input id="$3" placeholder="Buy eggs" value="" />
    <button id="$4">Add</button>
  </div>
  <div style="gap:4px;display:flex;flex-direction:column">
    <div id="$6">
    </div>
  </div>
  <button id="$7" style="align-items:center">Remove</button>
</div>

<script>
// State
let state = {newTodo: "", todos: []};

function Todo(text, done) { return {text, done}; }

function $status() { return (("Todo List (" + String(size(state.todos))) + " items)"); }

function status() { return (("Todo List (" + String(size(state.todos))) + " items)"); }



function String(v) { return "" + v; }

const $1 = document.getElementById("$1");
const $3 = document.getElementById("$3");
const $4 = document.getElementById("$4");
const $6 = document.getElementById("$6");
const $7 = document.getElementById("$7");

function $u_1_text() { $1.textContent = $status(); }
function $u_3_val() { $3.value = state.newTodo; }
function $u_6_list() { $6.innerHTML = "";
  for (let index = 0; index < state.todos.length; index++) {
    const item = state.todos[index];
    const row = document.createElement("label");
    row.style.cssText = "display:block";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = item.done;
    cb.addEventListener("change", function() {
      state.todos[index].done = !state.todos[index].done;
      $u_6_list();
      $u_1_text();
    });
    row.appendChild(cb);
    row.appendChild(document.createTextNode(" " + item.text));
    $6.appendChild(row);
  } }

$3.addEventListener("input", function(e) {
  state.newTodo = e.value;
  $u_3_val();
});
$4.addEventListener("click", function() {
  state.todos = push(state.todos, Todo(state.newTodo, false));
  state.newTodo = "";
  $u_1_text();
  $u_3_val();
  $u_6_list();
});
$7.addEventListener("click", function() {
  state.todos = remove(state.todos, (size(state.todos) - 1));
  $u_1_text();
  $u_6_list();
});

// Initial sync
$u_1_text();
$u_3_val();
$u_6_list();
</script>
</body></html>
